name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install OS & Python deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev coreutils ca-certificates curl
          python -m pip install --upgrade pip
          python -m pip install --user --upgrade buildozer cython virtualenv

      - name: Verify basic tools
        run: |
          set -euo pipefail
          echo "git:" $(git --version)
          echo "python:" $(python --version)
          echo "pip:" $(python -m pip --version)
          echo "~/.local/bin in PATH:" $PATH

      - name: Clean buildozer.spec with Python and Build APK
        env:
          PATH: ${{ env.PATH }}:~/.local/bin
        run: |
          set -euo pipefail
          export PATH=$PATH:~/.local/bin
          # Use Python to remove BOM and leading blank lines (no sed/awk/head needed)
          python - <<'PY'
import sys, io, os
fn = 'buildozer.spec'
if not os.path.exists(fn):
    print(f'ERROR: {fn} not found in repo root', file=sys.stderr)
    sys.exit(1)
with open(fn, 'rb') as f:
    b = f.read()
# Remove UTF-8 BOM if present
if b.startswith(b'\xef\xbb\xbf'):
    b = b[3:]
# Decode and remove leading blank lines
s = b.decode('utf-8', errors='replace')
lines = s.splitlines()
# drop leading empty/whitespace-only lines
i = 0
while i < len(lines) and lines[i].strip() == '':
    i += 1
out = '\n'.join(lines[i:]) + ('\n' if not s.endswith('\n') else '')
# Basic sanity check: first non-empty char should be '[' for [app] section
if not out.lstrip().startswith('['):
    print('WARNING: buildozer.spec does not start with [ — buildozer may fail', file=sys.stderr)
with open(fn, 'w', encoding='utf-8') as f:
    f.write(out)
print('buildozer.spec cleaned')
PY
          # 显示前 8 行以便排查
          python - <<'PY'
with open('buildozer.spec','r',encoding='utf-8') as f:
    for i,l in enumerate(f):
        if i>=8: break
        print(f"{i+1:2d}: {l.rstrip()[:200]}")
PY
          # Build (use yes to auto-confirm)
          yes y | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECG-App-Download
          path: bin/*.apk
