name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Android Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev coreutils ca-certificates curl

      - name: Install Buildozer (Global)
        run: |
          # 这样安装能确保 buildozer 命令全局可用
          sudo pip3 install buildozer cython virtualenv

      - name: Repair buildozer.spec
        shell: python
        run: |
          import os
          if os.path.exists('buildozer.spec'):
              with open('buildozer.spec', 'rb') as f:
                  content = f.read()
              if content.startswith(b'\xef\xbb\xbf'):
                  content = content[3:]
              clean_text = content.decode('utf-8').strip()
              with open('buildozer.spec', 'w', encoding='utf-8') as f:
                  f.write(clean_text)

      - name: Run Buildozer
        run: |
          # 核心修复方案：强制降低编译器的严苛程度，忽略 implicit-function-declaration 错误
          # 同时添加 CFLAGS 环境变量，这是解决 hostpython3 编译失败的通用办法
          export CFLAGS="-Wno-implicit-function-declaration"
          export CXXFLAGS="-Wno-implicit-function-declaration"
          
          yes y | buildozer -v android debug
        env:
          # 有些版本的 p4a 需要通过这个方式传递参数
          APP_CFLAGS: "-Wno-error=implicit-function-declaration"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECG-App-Download
          path: bin/*.apk
