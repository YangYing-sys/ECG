name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install OS & Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev coreutils ca-certificates curl
          python -m pip install --upgrade pip
          python -m pip install --user --upgrade buildozer cython virtualenv

      - name: Fix spec and Build APK
        env:
          PATH: ${{ env.PATH }}:~/.local/bin
        run: |
          export PATH=$PATH:~/.local/bin

          # 1. 彻底清除 buildozer.spec 中可能存在的 UTF-8 BOM 头
          sed -i 's/\xEF\xBB\xBF//g' buildozer.spec

          # 2. 自动删除所有前导空行，确保首行必定为 [app]
          sed -i '/./,$!d' buildozer.spec

          # 3. 打印前 5 行用于在日志中肉眼确认格式
          head -n 5 buildozer.spec

          # 4. 开始打包程序
          yes y | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECG-App-Download
          path: bin/*.apk
