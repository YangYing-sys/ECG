name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install OS & Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev coreutils
          python -m pip install --upgrade pip
          python -m pip install --user --upgrade buildozer cython virtualenv

      - name: Clean buildozer.spec & Build APK
        env:
          PATH: ${{ env.PATH }}:~/.local/bin
        run: |
          export PATH=$PATH:~/.local/bin
          # 删除可能的 UTF-8 BOM（会导致 configparser MissingSectionHeaderError）
          sed -i '1s/^\xEF\xBB\xBF//' buildozer.spec || true
          # 删除文件开头的所有空行，确保第一行就是 [app]
          awk 'BEGIN{p=0} {if(p==0 && $0 ~ /^\s*$/) next; p=1; print}' buildozer.spec > buildozer.spec.tmp && mv buildozer.spec.tmp buildozer.spec
          # 显示前几行帮助排查（可删除）
          head -n 8 buildozer.spec
          # 使用 yes（coreutils 已安装）自动确认所有提示
          yes y | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECG-App-Download
          path: bin/*.apk
