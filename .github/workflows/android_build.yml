name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install OS & Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev coreutils ca-certificates curl
          python -m pip install --upgrade pip
          python -m pip install --user --upgrade buildozer cython virtualenv

      - name: Fix spec and Build APK
        env:
          PATH: ${{ env.PATH }}:~/.local/bin
        run: |
          export PATH=$PATH:~/.local/bin
          # 使用 Python 脚本安全清理 spec 文件中的 BOM 和空行，确保缩进安全
          python - <<'PY'
          import os, sys
          fn = 'buildozer.spec'
          if not os.path.exists(fn):
              print("Error: buildozer.spec not found"); sys.exit(1)
          with open(fn, 'rb') as f:
              content = f.read()
          if content.startswith(b'\xef\xbb\xbf'):
              content = content[3:]
          lines = content.decode('utf-8').splitlines()
          i = 0
          while i < len(lines) and not lines[i].strip():
              i += 1
          with open(fn, 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines[i:]))
          print("Spec file cleaned.")
          PY
          # 开始进行 APK 打包
          yes y | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECG-App-Download
          path: bin/*.apk
