name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 这一步是为了向你证明：系统里绝对是有 git 的
      - name: Verify System Tools
        run: |
          which git
          which sed
          git --version

      - name: Install Android Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev coreutils ca-certificates curl

      - name: Install Buildozer (Global)
        run: |
          # 放弃 --user 模式，直接安装到全局，确保 buildozer 命令直接可用
          sudo pip3 install buildozer cython virtualenv

      - name: Repair buildozer.spec (Python Way)
        # 用 Python 直接重写文件，不调用任何 shell 命令，彻底杜绝特殊字符报错
        shell: python
        run: |
          import os
          content = open('buildozer.spec', 'rb').read()
          # 强行剥离 Windows 带来的 BOM 头
          if content.startswith(b'\xef\xbb\xbf'):
              content = content[3:]
          # 去掉首尾多余空格，确保 [app] 是第一个字符
          clean_text = content.decode('utf-8').strip()
          with open('buildozer.spec', 'w', encoding='utf-8') as f:
              f.write(clean_text)

      - name: Run Buildozer
        run: |
          # 使用绝对路径强制执行，或者直接执行（因为前面已经加了 sudo 安装）
          # yes y 是为了自动同意 Android SDK 的各种许可协议
          yes y | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECG-App-Download
          path: bin/*.apk
