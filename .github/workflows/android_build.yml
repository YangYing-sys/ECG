name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Buildozer
        id: buildozer
        # 使用官方/推荐的 action tag（避免找不到 main 或不存在的 v1.0.1）
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          # 如果 buildozer.spec 在仓库根目录，repository_root 与 workdir 可维持默认 (.) 
          # 明确填写以免歧义
          repository_root: .
          workdir: .
          buildozer_version: stable

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECG-App-Download
          # 该 action 会把生成包路径输出为 steps.buildozer.outputs.filename
          path: ${{ steps.buildozer.outputs.filename }}
