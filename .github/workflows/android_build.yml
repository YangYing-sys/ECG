name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # 方案一：如果 22.04 依然顽固，很多开发者会切回 20.04（环境更稳）
    # 但我们先尝试在 22.04 下通过强制参数解决
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Android Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev coreutils ca-certificates curl

      - name: Install Buildozer (Global)
        run: |
          sudo pip3 install buildozer cython virtualenv

      - name: Repair buildozer.spec and Force Master P4A
        shell: python
        run: |
          import os
          # 1. 修复文件编码和格式
          if os.path.exists('buildozer.spec'):
              with open('buildozer.spec', 'rb') as f:
                  content = f.read().replace(b'\xef\xbb\xbf', b'')
              text = content.decode('utf-8').strip()
              
              # 2. 方案二：强制 Buildozer 使用最新的 python-for-android 分支
              # 这样它会包含对新版 GCC 的兼容性补丁
              if 'p4a.branch =' in text:
                  lines = text.split('\n')
                  new_lines = []
                  for line in lines:
                      if line.startswith('p4a.branch'):
                          new_lines.append('p4a.branch = master')
                      else:
                          new_lines.append(line)
                  text = '\n'.join(new_lines)
              
              with open('buildozer.spec', 'w', encoding='utf-8') as f:
                  f.write(text)

      - name: Run Buildozer
        run: |
          # 方案三：【最关键的一步】
          # 我们不只传 CFLAGS，我们直接修改 CC（编译器命令）
          # 把“忽略警告”直接焊死在编译器命令里，这样 Makefile 里的参数就无法覆盖它了
          export CC="gcc -Wno-error=implicit-function-declaration"
          
          # 告诉 Python 的 configure 脚本：不要把这个警告当错误（预设缓存变量）
          export ac_cv_warn_c99_implicit_function_declaration=no
          
          # 开始打包
          yes y | buildozer -v android debug
