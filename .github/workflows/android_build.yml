name: Build Android APK (fast)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    # 若想只构建 arm64（更快），可以在这里设置环境变量覆盖
    env:
      APP_ANDROID_ARCH: arm64-v8a

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show python & buildozer versions
        run: |
          python3 -V
          pip3 -V
          buildozer -v || true

      - name: Clean previous build artifacts (optional but recommended)
        run: |
          rm -rf .buildozer bin || true

      - name: Build APK (android debug)
        run: |
          cd $GITHUB_WORKSPACE
          # 非交互、详细输出，按需改为 `buildozer android debug` 或 `buildozer -v android debug`
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECG-App-Download
          path: bin/*.apk
