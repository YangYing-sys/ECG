name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Operating System Dependencies
        # 这里系统环境变量是正常的，可以正常执行指令
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev coreutils ca-certificates curl

      - name: Install Buildozer and Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user --upgrade buildozer cython virtualenv
          # 使用官方推荐方式将 buildozer 路径加入系统路径，而不破坏原有的 PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build APK with Buildozer
        run: |
          # 1. 修复 buildozer.spec 的格式（BOM头和空行）
          # 我们不再使用环境变量覆盖，直接调用原生命令
          /usr/bin/sed -i 's/\xEF\xBB\xBF//g' buildozer.spec
          /usr/bin/sed -i '/./,$!d' buildozer.spec
          
          # 2. 打印确认一下 spec 文件首行，防止 debug
          head -n 3 buildozer.spec
          
          # 3. 开始打包，使用 yes 自动跳过所有协议确认
          yes y | buildozer -v android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECG-App-Download
          path: bin/*.apk
